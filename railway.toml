[build]
builder = "nixpacks"
buildCommand = "cd backend && npm install --legacy-peer-deps && npx tsc && npm prune --omit=dev"

[deploy]
startCommand = "cd backend && npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[deploy.env]
NODE_ENV = "production"
PORT = "5000"
DB_TYPE = "postgres"