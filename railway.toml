[build]
builder = "nixpacks"
buildCommand = "cd frontend && npm ci && npm run build && cd ../backend && npm ci && npm run build && npm prune --omit=dev && cp src/db/postgres-schema.sql dist/db/postgres-schema.sql"

[deploy]
startCommand = "cd backend && npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[deploy.env]
NODE_ENV = "production"
PORT = "5000"
DB_TYPE = "postgres"