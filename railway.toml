[build]
builder = "nixpacks"
buildCommand = "cd frontend && npm install && npm run build && cd ../backend && NODE_ENV=development npm install && npx tsc && NODE_ENV=production npm prune --omit=dev"

[deploy]
startCommand = "cd backend && npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[deploy.env]
NODE_ENV = "production"
PORT = "5000"
DB_TYPE = "postgres"